[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qlora-agent-lab"
version = "0.1.0"
description = "Windows-friendly QLoRA training, FastAPI inference, mock tools, and LangChain agent lab"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Chi111" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ml = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45.5",
  "datasets>=4.7,<5",
  "peft>=0.17,<1",
  "pyyaml>=6.0,<7",
  "safetensors>=0.5,<1",
  "transformers>=4.51,<6",
  "trl>=1.0,<2",
]
agent = [
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]
[project.scripts]
qlora-preflight = "qlora_lab.training.preflight:main"
qlora-validate-data = "qlora_lab.training.validate_data:main"
qlora-train = "qlora_lab.training.train:main"
qlora-inference = "qlora_lab.inference.app:main"
qlora-mock-backend = "qlora_lab.mock_backend.app:main"
qlora-agent = "qlora_lab.agent.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qlora_lab"]

[tool.hatch.build.targets.wheel.force-include]
"data/knowledge" = "qlora_lab/agent/knowledge_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
