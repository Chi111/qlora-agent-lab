# Faster/larger profile for a 16 GB GPU. Reduce max_length first if CUDA runs out of memory.
base_model_id: Qwen/Qwen3-4B
train_file: data/train.jsonl
eval_file: data/eval.jsonl
output_dir: artifacts/qlora-adapter
max_length: 1024
epochs: 2
learning_rate: 0.0002
batch_size: 1
gradient_accumulation_steps: 8
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
logging_steps: 5
save_steps: 50
eval_steps: 50
weight_decay: 0.01
warmup_ratio: 0.03
assistant_only_loss: true
seed: 42
resume_from_checkpoint: null
